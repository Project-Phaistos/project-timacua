name: Inspect archived Timucua analysis package

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis_all.zip'
      - 'build/**'
      - '.github/workflows/inspect-analysis-archive.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive contents
        run: |
          unzip -l analysis_all.zip | sed -n '1,180p'
      - name: Expand source package
        run: |
          unzip -q analysis_all.zip
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | sed -n '1,220p'
          echo "Analysis source files:"
          find analysis -maxdepth 3 -type f | sort | sed -n '1,260p'
      - name: Locate pipeline instructions and dependency manifests
        run: |
          find analysis -type f \( -iname 'README*' -o -iname '*requirements*.txt' -o -iname 'environment*.yml' -o -iname 'pyproject.toml' -o -iname 'Makefile' -o -iname '*.sh' \) -print
          for f in $(find analysis -type f \( -iname 'README*' -o -iname '*requirements*.txt' -o -iname 'environment*.yml' -o -iname 'pyproject.toml' -o -iname 'Makefile' -o -iname '*.sh' \) | head -20); do
            echo "===== $f ====="
            sed -n '1,240p' "$f"
          done
          for f in analysis/src/01_build_dataset.py analysis/src/05_similarity_grid.py analysis/src/07_run_workstream_b.py analysis/src/08_freeze_prereg.py analysis/src/12_haas1937_boynton_checks.py analysis/src/common.py analysis/src/03_validation.py analysis/src/09_wals_typology.py analysis/cldf/provenance.json; do
            if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,240p' "$f"; fi
          done
          echo '===== pinned provenance ====='
          if [ -f analysis/src/PROVENANCE.md ]; then sed -n '1,240p' analysis/src/PROVENANCE.md; fi
