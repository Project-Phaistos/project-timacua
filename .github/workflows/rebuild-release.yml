name: Rebuild Timucua public release from archived source

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis_all.zip'
      - 'build/**'
      - 'cldf/**'
      - '.github/workflows/rebuild-release.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expand archived analysis source
        run: unzip -q analysis_all.zip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy rapidfuzz lingpy pycldf
      - name: Rebuild CLDF, SQLite and website
        run: ./build/build.sh
      - name: Validate rebuilt release
        run: |
          python qa/check_release.py
          python qa/calibration_report.py
          git diff --check
      - name: Upload rebuilt release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timucua-rebuilt-release
          path: |
            cldf/
            db/project-phaistos.sqlite
            tables/
            docs/index.html
            build/site/
          if-no-files-found: warn
          retention-days: 30
