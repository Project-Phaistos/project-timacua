name: Release data checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect and integrity-check archived analysis sources
        run: |
          unzip -t analysis_all.zip
          unzip -l analysis_all.zip | sed -n '1,100p'
      - name: Validate committed CLDF release
        run: python qa/check_release.py
      - name: Audit frozen contact-detection calibration controls
        run: python qa/calibration_report.py
      - name: Ensure calibration output is reproducible
        run: git diff --exit-code -- qa/calibration_report.json
      - name: Validate archival-text annotation prototype
        run: |
          printf 'text_id,line_id,token_id,source_ref,diplomatic_form,certainty,review_status\nT1,L1,T1-L1-1,folio-1,example,high,unreviewed\n' > /tmp/timucua-annotation-smoke.csv
          python tools/timucua_text/validate.py /tmp/timucua-annotation-smoke.csv
