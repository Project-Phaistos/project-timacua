name: Release data checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect and integrity-check archived analysis sources
        run: |
          unzip -t analysis_all.zip
          unzip -l analysis_all.zip | sed -n '1,100p'
      - name: Expand archived analysis source package
        run: unzip -oq analysis_all.zip
      - name: Read archived analysis runbook
        run: sed -n '1,220p' analysis/README.md
      - name: Install database rebuild dependencies
        run: python -m pip install pycldf lingpy lingrex python-igraph rapidfuzz scipy pandas
      - name: Set deterministic build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Rebuild CLDF, SQLite, wide tables and project website
        run: bash build/build.sh
      - name: Report generated release differences
        run: |
          git status --short -- cldf db tables docs
          git diff --stat -- cldf db tables docs
          git diff -- cldf/Wordlist-metadata.json docs/index.html
      - name: Compare rebuilt SQLite logical contents with committed database
        run: python qa/compare_sqlite.py
      - name: Validate rebuilt CLDF release
        run: python qa/check_release.py
      - name: Audit archived analysis source logic and portability
        run: python qa/audit_analysis_source.py
      - name: Ensure source audit report is reproducible
        run: git diff --exit-code -- qa/analysis_source_audit.json
      - name: Audit frozen contact-detection calibration controls
        run: python qa/calibration_report.py
      - name: Ensure calibration output is reproducible
        run: git diff --exit-code -- qa/calibration_report.json
      - name: Unit-test archival-text annotation validator
        run: python -m unittest discover -s tests -v
      - name: Validate archival-text annotation prototype
        run: |
          printf 'text_id,line_id,token_id,source_ref,diplomatic_form,certainty,review_status\nT1,L1,T1-L1-1,folio-1,example,high,unreviewed\n' > /tmp/timucua-annotation-smoke.csv
          python tools/timucua_text/validate.py /tmp/timucua-annotation-smoke.csv
      - name: Upload source and calibration audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timucua-qa-reports
          path: |
            qa/analysis_source_audit.json
            qa/calibration_report.json
            qa/sqlite_rebuild_comparison.json
          if-no-files-found: warn
          retention-days: 30
